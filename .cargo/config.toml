[target.wasm32-unknown-unknown]
rustflags = [
    "-C",
    "target-feature=+bulk-memory",
    "-C",
    "link-arg=--max-memory=4294967296",
    "--cfg=web_sys_unstable_apis",
]

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[alias]
# Refill the generated regions of the repository's markdown from the registries.
# `cargo sync-docs -- --check` reports drift without writing; `tests/docs_md.rs`
# asserts the same thing, so CI catches a stale region either way.
sync-docs = "run --quiet -p darkly --bin sync-docs"
# `cargo releases --fetch X.Y.Z` writes one entry of crates/darkly/releases.json
# from the tag graph and GitHub; the one command here that touches the network.
# `cargo releases --notes vX.Y.Z` prints that entry as release notes, offline.
releases = "run --quiet -p darkly --bin releases --"
