[workspace]
members = [
    "crates/darkly",
    "frontend/wasm",
]
default-members = [
    "crates/darkly",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Local crates
darkly = { path = "crates/darkly" }

# GPU
wgpu = { version = "29.0", features = ["webgpu"] }

# Data
bytemuck = { version = "1.13", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml_ng, not serde_yml: the original `serde_yaml` (dtolnay) is archived,
# and the `serde_yml` fork is unmaintained — its 0.0.13 release swapped to a
# `noyalib` backend that can't round-trip integer-keyed maps (`BTreeMap<u64,_>`),
# which silently breaks the brush portable format. serde_yaml_ng is the faithful
# maintained fork and a drop-in for the original serde_yaml API.
serde_yaml_ng = "0.10"
log = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
quick-xml = "0.40"
base64 = "0.22"
thiserror = "2.0"
slotmap = { version = "1.0", features = ["serde"] }
smallvec = "1"

# WASM
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "=0.3.91"
web-sys = { version = "=0.3.91", features = [
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "Window",
    "Navigator",
    "Gpu",
    "OffscreenCanvas",
    "ImageBitmap",
    "console",
] }
web-time = "1.1.0"
console_error_panic_hook = "0.1"
console_log = "1"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[workspace.lints.clippy]
too_many_arguments = "allow"
