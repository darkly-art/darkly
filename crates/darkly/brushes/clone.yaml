name: Clone
category: Misc
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 0.05
  shape:
    type: shape
    inputs:
      softness: 0.2
  clone_source:
    type: clone_source
  stamp:
    type: stamp
  paint:
    type: paint
connections:
- 'pen_input.position -> clone_source.center'
- 'pen_input.position -> paint.position'
- 'pen_input.pressure -> paint.size'
- 'shape.mask -> stamp.tip'
- 'clone_source.color -> stamp.color'
- 'stamp.dab -> paint.rgba'
exposed_ports:
  'brush_settings.size': {}
  'paint.opacity': {}
  'shape.softness': {}
  'brush_settings.spacing': {}
  'clone_source.mode': {}
  'clone_source.merged': {}
