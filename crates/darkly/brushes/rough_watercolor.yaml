    type: pen_input
    inputs:
      stabilize: 0.5
  2:
    type: paint_color
  3:
    type: shape
    inputs:
      algorithm: 1
      amplitude: 0.4
      frequency: 12.0
      octaves: 4.0
      persistence: 0.55
      softness: 0.05
