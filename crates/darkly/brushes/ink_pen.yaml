name: Ink Pen
category: Basic
description: A crisp-edged nib with a slow pressure ramp, for confident line work that holds its weight.
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.6
  circle:
    type: circle
    inputs:
      softness: 0.1
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> stamp.tip
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> paint.flow
- pen_input.pressure -> paint.size
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  circle.softness: {}
  paint.flow: {}
  paint.opacity: {}
