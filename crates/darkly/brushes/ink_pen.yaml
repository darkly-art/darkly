name: Ink Pen
category: Basic
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.6
  paint_color:
    type: paint_color
  shape:
    type: shape
    inputs:
      softness: 0.1
  stamp:
    type: stamp
  paint:
    type: paint
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.0
      - - 0.4
        - 0.7
      - - 1.0
        - 1.0
connections:
- 'pen_input.position -> paint.position'
- 'pen_input.pressure -> paint.flow'
- 'pen_input.pressure -> curve.input'
- 'paint_color.color -> stamp.color'
- 'shape.mask -> stamp.tip'
- 'stamp.dab -> paint.rgba'
- 'curve.output -> paint.size'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "shape.softness": {}
  "paint.flow": {}
  "paint.opacity": {}
