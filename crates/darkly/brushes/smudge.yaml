name: Smudge
description: Drags existing pigment along the stroke, the way a finger pulls through wet paint.
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 0.01
      stabilize: 0.4
  circle:
    type: circle
    inputs:
      softness: 0.4
  smudge:
    type: smudge
connections:
- 'pen_input.motion -> smudge.motion'
- 'pen_input.position -> smudge.position'
- 'pen_input.pressure -> smudge.size'
- 'circle.mask -> smudge.mask'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "circle.softness": {}
  "smudge.opacity": {}
  "smudge.rate": {}
