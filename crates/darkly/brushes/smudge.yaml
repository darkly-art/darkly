name: Smudge
category: Effects
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 0.01
      stabilize: 0.4
  shape:
    type: shape
    inputs:
      softness: 0.4
  smudge:
    type: smudge
connections:
- 'pen_input.motion -> smudge.motion'
- 'pen_input.position -> smudge.position'
- 'pen_input.pressure -> smudge.size'
- 'shape.mask -> smudge.mask'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "shape.softness": {}
  "smudge.opacity": {}
  "smudge.rate": {}
