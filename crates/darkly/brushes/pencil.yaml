name: Pencil
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.08671875298023224
      spacing: 0.009999999776482582
  circle:
    type: circle
    inputs:
      frequency: 1.0
      rotation: 5.75
      softness: 0.8564339280128479
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.0
      - - 0.5640479
        - 0.35878405
      - - 1.0
        - 1.0
  curve_2:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.07414697
      - - 1.0
        - 0.48648626
  multiply:
    type: multiply
  multiply_2:
    type: multiply
  multiply_3:
    type: multiply
  noise:
    type: noise
    inputs:
      scale: 8.010828971862793
      space: 1
  noise_2:
    type: noise
    inputs:
      scale: 3.0
  paint:
    type: paint
    inputs:
      flow: 0.5
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> multiply_2.b
- curve.output -> multiply_3.a
- curve_2.output -> multiply_3.b
- curve_2.output -> paint.size
- multiply.result -> stamp.tip
- multiply_2.result -> curve.input
- multiply_3.result -> multiply.b
- noise.value -> multiply_2.a
- noise_2.value -> multiply.a
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> curve_2.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.opacity: {}
  paint.flow: {}
  circle.softness: {}
