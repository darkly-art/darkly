name: Sponge
category: Dry Media
description: A textured brush useful for laying down big, smooth shapes
nodes:
  add:
    type: add
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.2
      spacing: 0.02
      stabilize: 1.0
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.70523924
      - - 0.59307975
        - 0.36470732
      - - 1.0
        - 0.0
  curve_2:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.0
      - - 0.6392242
        - 0.36304563
      - - 1.0
        - 1.0
  levels:
    type: levels
  noise:
    type: noise
    inputs:
      scale: 6.0
      space: 1
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  polygon:
    type: polygon
    inputs:
      points: 4
      rounding: 0.30
      softness: 0.30
      squeeze: 0.35
      squeeze_angle: -0.7853981852531433
  random:
    type: random
  random_2:
    type: random
  stamp:
    type: stamp
  subtract:
    type: subtract
    inputs:
      a: 0.11924592405557632
connections:
- add.result -> levels.input
- curve.output -> levels.in_low
- curve_2.output -> paint.flow
- levels.output -> stamp.tip
- noise.value -> subtract.b
- paint_color.color -> stamp.color
- pen_input.drawing_angle -> polygon.rotation_input
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- pen_input.pressure -> curve_2.input
- polygon.mask -> add.b
- random.value -> noise.rotation
- random_2.value -> noise.variation
- stamp.dab -> paint.rgba
- subtract.result -> add.a
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.flow: {}
  paint.opacity: {}
  polygon.softness: {}
  polygon.rounding: {}
