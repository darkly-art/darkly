name: Hair
category: Dry Media
description: A bundle of fine strands that breaks each dab into separate hairs, for fur, grass and dry-bristle texture.
nodes:
  add:
    type: add
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.9002734422683716
      spacing: 0.009999999776482582
      stabilize: 1.0
  circle:
    type: circle
  curve:
    type: curve
    comment: pen pressure affects the threshold of hair volume
    inputs:
      curve:
      - - 0.0
        - 1.0
      - - 0.48145637
        - 0.795719
      - - 1.0
        - 0.6756355
  curve_2:
    type: curve
    comment: maps the 0-1 Hair Thickness slider onto the usable band
    inputs:
      curve:
      - - 0.0
        - 0.03296951
      - - 1.0
        - 0.21059628
      input: 0.5
  divide:
    type: divide
  levels:
    type: levels
  multiply:
    type: multiply
    inputs:
      b: 5.12
  multiply_2:
    type: multiply
  multiply_3:
    type: multiply
  noise:
    type: noise
    inputs:
      scale: 12.0
      space: 1
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
  subtract:
    type: subtract
    inputs:
      a: 0.11999999731779099
  subtract_2:
    type: subtract
    comment: recenters the 0-1 Twirl slider on zero, so either half twirls the
      opposite way
    inputs:
      a: 0.75
      b: 0.5
connections:
- add.result -> levels.input
- brush_settings.size -> divide.b
- brush_settings.size -> multiply_3.a
- circle.mask -> add.b
- curve.output -> levels.in_low
- curve_2.output -> multiply_3.b
- divide.result -> multiply.a
- levels.output -> stamp.tip
- multiply.result -> multiply_2.b
- multiply_2.result -> noise.rotation
- multiply_3.result -> noise.scale
- noise.value -> subtract.b
- paint_color.color -> stamp.color
- pen_input.distance -> divide.a
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
- subtract.result -> add.a
- subtract_2.result -> multiply_2.a
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  subtract_2.a:
    label: Twirl
    description: Twirliness factor
    icon: tabler:galaxy
  paint.flow: {}
  paint.opacity: {}
  curve_2.input:
    label: Hair Thickness
    description: Controls how many and how thick are the individual strands
    icon: fa6-solid:arrows-left-right
