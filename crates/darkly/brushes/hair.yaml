nodes:
  add:
    type: add
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.5685366988182068
      spacing: 0.009999999776482582
      stabilize: 1.0
  circle:
    type: circle
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 1.0
      - - 0.6688293
        - 0.49044272
      - - 1.0
        - 0.0
  levels:
    type: levels
  noise:
    type: noise
    inputs:
      scale: 12.040367126464844
      scale_with_brush: false
      space: 1
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
  subtract:
    type: subtract
    inputs:
      a: 0.11924592405557632
connections:
- add.result -> levels.input
- circle.mask -> add.b
- curve.output -> levels.in_low
- levels.output -> stamp.tip
- noise.value -> subtract.b
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
- subtract.result -> add.a
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.flow: {}
  paint.opacity: {}
