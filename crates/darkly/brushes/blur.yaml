name: Blur
category: Effects
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 0.01
      stabilize: 0.4
      size: 0.2
  circle:
    type: circle
    inputs:
      softness: 1.0
  blur:
    type: blur
connections:
- 'pen_input.position -> blur.position'
- 'pen_input.pressure -> blur.size'
- 'circle.mask -> blur.mask'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "circle.softness": {}
  "blur.strength": {}
  "blur.opacity": {}
