name: Rough Ink
category: Basic
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.6
  paint_color:
    type: paint_color
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.0
      - - 0.4
        - 0.7
      - - 1.0
        - 1.0
  random:
    type: random
  random_2:
    type: random
  random_3:
    type: random
  shape:
    type: shape
    inputs:
      algorithm: 1
      frequency: 8.0
      octaves: 4.0
      softness: 0.1
  stamp:
    type: stamp
  paint:
    type: paint
connections:
- 'pen_input.position -> paint.position'
- 'pen_input.pressure -> curve.input'
- 'pen_input.pressure -> paint.flow'
- 'paint_color.color -> stamp.color'
- 'curve.output -> paint.size'
- 'random.value -> shape.amplitude'
- 'random_2.value -> shape.rotation_input'
- 'random_3.value -> shape.seed'
- 'shape.mask -> stamp.tip'
- 'stamp.dab -> paint.rgba'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "paint.flow": {}
  "paint.opacity": {}
