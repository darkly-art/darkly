name: Rough Ink
description: An ink nib whose edge is reshaped at random every dab, producing line work that looks bitten rather than printed.
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.6
  circle:
    type: circle
    inputs:
      algorithm: 1
      frequency: 8.0
      octaves: 4.0
      softness: 0.1
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  random:
    type: random
  random_2:
    type: random
  random_3:
    type: random
  stamp:
    type: stamp
connections:
- circle.mask -> stamp.tip
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> paint.flow
- pen_input.pressure -> paint.size
- random.value -> circle.amplitude
- random_2.value -> circle.rotation_input
- random_3.value -> circle.seed
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  paint.flow: {}
  paint.opacity: {}
