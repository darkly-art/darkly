name: Airbrush
description: A fully soft disc that builds color up gradually; hold it in one place and the tone deepens.
nodes:
  brush_settings:
    type: brush_settings
  circle:
    type: circle
    inputs:
      softness: 1.0
  curve:
    type: curve
    inputs:
      curve:
      - - 0.0
        - 0.0
      - - 0.616092
        - 0.31422412
      - - 1.0
        - 1.0
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> stamp.tip
- curve.output -> paint.build_flow
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  circle.softness: {}
  paint.build_flow: {}
  paint.opacity: {}
