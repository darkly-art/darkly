name: Airbrush
category: basic
nodes:
  1:
    type: pen_input
  2:
    type: paint_color
  3:
    type: circle
    port_defaults:
      softness: 1.0
    exposed:
    - softness
  4:
    type: stamp
  5:
    type: paint
    exposed:
    - flow
    - opacity
    - size
connections:
- '1.position -> 5.position'
- '1.pressure -> 5.flow'
- '2.color -> 4.color'
- '3.mask -> 4.tip'
- '4.dab -> 5.rgba'
