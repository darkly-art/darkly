name: Airbrush
category: Basic
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
  paint_color:
    type: paint_color
  shape:
    type: shape
    inputs:
      softness: 1.0
  stamp:
    type: stamp
  paint:
    type: paint
connections:
- 'pen_input.position -> paint.position'
- 'pen_input.pressure -> paint.flow'
- 'paint_color.color -> stamp.color'
- 'shape.mask -> stamp.tip'
- 'stamp.dab -> paint.rgba'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "shape.softness": {}
  "paint.flow": {}
  "paint.opacity": {}
