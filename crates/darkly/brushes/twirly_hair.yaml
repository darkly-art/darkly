name: Twirly Hair
category: Dry Media
description: Hair strands that coil as the stroke moves, for curled fur, smoke and windblown texture.
nodes:
  add:
    type: add
  brush_settings:
    type: brush_settings
    inputs:
      size: 0.4
      spacing: 0.01
      stabilize: 1.0
  circle:
    type: circle
  curve:
    type: curve
    comment: pen pressure affects the threshold of hair volume
    inputs:
      curve:
      - - 0.0
        - 1.0
      - - 0.682973
        - 0.5305826
      - - 1.0
        - 0.0
  divide:
    type: divide
    comment: we have to divide the distance factor by the brush size, to keep the 'twirl' setting consistent
  levels:
    type: levels
  multiply:
    type: multiply
    inputs:
      b: 0.005
  multiply_2:
    type: multiply
    inputs:
      a: 0.5
  noise:
    type: noise
    inputs:
      scale: 12
      scale_with_brush: false
      space: 1
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
  subtract:
    type: subtract
    inputs:
      a: 0.11924592405557632
connections:
- add.result -> levels.input
- brush_settings.size -> divide.b
- circle.mask -> add.b
- curve.output -> levels.in_low
- divide.result -> multiply.a
- levels.output -> stamp.tip
- multiply.result -> multiply_2.b
- multiply_2.result -> noise.rotation
- noise.value -> subtract.b
- paint_color.color -> stamp.color
- pen_input.distance -> divide.a
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- stamp.dab -> paint.rgba
- subtract.result -> add.a
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  multiply_2.a:
    label: Twirl
    description: Twirliness factor
    icon: tabler:galaxy
  paint.flow: {}
  paint.opacity: {}
