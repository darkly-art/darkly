name: Smooth Watercolor
description: Wet pigment that pools and blends into what is already on the canvas, with a soft, even edge.
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.5
  paint_color:
    type: paint_color
  circle:
    type: circle
    inputs:
      amplitude: 0.05
      frequency: 5.0
  watercolor:
    type: watercolor
  random:
    type: random
connections:
- 'pen_input.position -> watercolor.position'
- 'pen_input.pressure -> watercolor.flow'
- 'paint_color.color -> watercolor.color'
- 'circle.mask -> watercolor.mask'
- 'random.value -> circle.rotation_input'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "circle.softness": {}
  "watercolor.deposit": {}
  "watercolor.flow": {}
  "watercolor.opacity": {}
  "watercolor.wetness": {}
  "watercolor.pickup_size": {}
