name: Smooth Watercolor
category: Wet Media
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.5
  paint_color:
    type: paint_color
  shape:
    type: shape
    inputs:
      amplitude: 0.05
      frequency: 5.0
  watercolor:
    type: watercolor
  random:
    type: random
connections:
- 'pen_input.position -> watercolor.position'
- 'pen_input.pressure -> watercolor.flow'
- 'paint_color.color -> watercolor.color'
- 'shape.mask -> watercolor.mask'
- 'random.value -> shape.rotation_input'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "shape.softness": {}
  "watercolor.deposit": {}
  "watercolor.flow": {}
  "watercolor.opacity": {}
  "watercolor.wetness": {}
  "watercolor.pickup_size": {}
