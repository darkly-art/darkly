name: Smooth Watercolor
category: wet_media
nodes:
  1:
    type: pen_input
    port_defaults:
      stabilize: 0.5
    exposed:
    - stabilize
  2:
    type: paint_color
  3:
    type: circle
    port_defaults:
      amplitude: 0.05
      frequency: 5.0
    exposed:
    - softness
  4:
    type: watercolor
    exposed:
    - deposit
    - flow
    - opacity
    - pickup_size
    - size
    - wetness
  5:
    type: random
connections:
- '1.position -> 4.position'
- '1.pressure -> 4.flow'
- '2.color -> 4.color'
- '3.mask -> 4.mask'
- '5.value -> 3.phase_input'
