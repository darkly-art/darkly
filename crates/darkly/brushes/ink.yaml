name: Ink
description: "A hard inking nib. Pressure sets the width and nothing else: the line stays solid at any touch. Roughness bites the edge; turn it to zero for a clean round, up for line work that looks bitten rather than printed."
nodes:
  pen_input:
    type: pen_input
    name: Pen
  brush_settings:
    type: brush_settings
    name: Brush settings
    comment: Extra stabilization, since line work wants a steady hand.
    inputs:
      stabilize: 0.6
  width_curve:
    type: curve
    name: Pressure to width
    comment: Pressure sets the width, eased so a light touch draws a thin line without vanishing.
    inputs:
      curve:
      - - 0.0
        - 0.08
      - - 0.5
        - 0.38
      - - 1.0
        - 1.0
  roughness:
    type: user_input
    name: Roughness
    comment: How far the edge is bitten; zero is a clean disc.
    inputs:
      value: 0.35
  bite_draw:
    type: random
    name: Bite per dab
    comment: A fresh bite every dab, so the edge varies along the stroke.
  bite:
    type: multiply
    name: Edge bite
    comment: Roughness scaled by the per-dab draw.
  seed_draw:
    type: random
    name: Edge pattern per dab
    comment: A new edge pattern every dab.
  spin_draw:
    type: random
    name: Edge spin per dab
    comment: Spins the edge pattern each dab so bumps never line up.
  circle:
    type: circle
    name: Nib
    comment: A hard disc with a noisy edge.
    inputs:
      algorithm: 1
      frequency: 8.0
      octaves: 4.0
      softness: 0.1
  paint_color:
    type: paint_color
    name: Ink color
  stamp:
    type: stamp
    name: Stamp
    comment: The nib filled with the current color.
  paint:
    type: paint
    name: Deposit
    comment: Overlapping dabs make one solid line.
connections:
- pen_input.position -> paint.position
- pen_input.pressure -> width_curve.input
- width_curve.output -> paint.size
- roughness.value -> bite.a
- bite_draw.value -> bite.b
- bite.result -> circle.amplitude
- seed_draw.value -> circle.seed
- spin_draw.value -> circle.rotation_input
- circle.mask -> stamp.tip
- paint_color.color -> stamp.color
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.size: {}
  paint.opacity: {}
  brush_settings.stabilize: {}
  roughness.value:
    label: Roughness
    description: How far the edge of the nib is bitten. Zero is a clean round.
    icon: tabler:grain
  circle.softness: {}
