name: Calligraphy
description: "A broad nib held at a fixed angle, so strokes thicken and thin with direction. Roughness bites the edge; zero is a clean nib."
nodes:
  pen_input:
    type: pen_input
    name: Pen
    comment: Pressure is unwired on purpose; line weight comes from direction alone.
  brush_settings:
    type: brush_settings
    name: Brush settings
    comment: Tight spacing keeps the nib's thin edge continuous.
    inputs:
      spacing: 0.018592645
      stabilize: 0.6
      size: 0.125
  paint_color:
    type: paint_color
    name: Ink color
  roughness:
    type: user_input
    name: Roughness
    comment: How far the edge is bitten; zero is a clean nib.
    inputs:
      value: 0.15
  bite_draw:
    type: random
    name: Bite per dab
    comment: A fresh bite every dab, so the edge varies along the stroke.
  bite:
    type: multiply
    name: Edge bite
    comment: Roughness scaled by the per-dab draw.
  seed_draw:
    type: random
    name: Edge pattern per dab
    comment: A new edge pattern every dab.
  circle:
    type: circle
    name: Nib
    comment: A broad nib held at a fixed angle, with a noisy edge.
    inputs:
      algorithm: 1
      frequency: 12.0
      octaves: 4.0
      softness: 0.0
      aspect: 0.16
      rotation: 0.7853982
  stamp:
    type: stamp
    name: Stamp
    comment: The nib filled with the current color.
  paint:
    type: paint
    name: Deposit
connections:
- pen_input.position -> paint.position
- paint_color.color -> stamp.color
- roughness.value -> bite.a
- bite_draw.value -> bite.b
- bite.result -> circle.amplitude
- seed_draw.value -> circle.seed
- circle.mask -> stamp.tip
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.size: {}
  paint.opacity: {}
  paint.build_flow:
    label: Flow
    description: How much ink each touch lays down.
  brush_settings.stabilize: {}
  circle.rotation: {}
  circle.aspect: {}
  roughness.value:
    label: Roughness
    description: How far the edge of the nib is bitten. Zero is a clean nib.
    icon: tabler:grain
