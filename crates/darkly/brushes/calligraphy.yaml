name: Calligraphy
description: A broad elliptical nib held at a fixed angle, so strokes thicken and thin with direction.
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 0.046481613
      stabilize: 0.6
      size: 0.05
  paint_color:
    type: paint_color
  circle:
    type: circle
    inputs:
      softness: 0.15
      # Plain disc (sine, amplitude 0 ⇒ r ≡ 1) squashed by `aspect` into the
      # elliptical broad-nib tip. `aspect` is area-preserving, so the nib is
      # ~6:1 here (1/0.4²). `rotation` is exposed to tilt the nib to taste
      # (e.g. the classic ~45° angle).
      aspect: 0.4
      rotation: 0.7853982
  stamp:
    type: stamp
  paint:
    type: paint
connections:
- pen_input.position -> paint.position
- paint_color.color -> stamp.color
- circle.mask -> stamp.tip
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  circle.rotation: {}
  circle.aspect: {}
  paint.flow: {}
  paint.opacity: {}
