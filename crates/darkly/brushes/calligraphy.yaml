name: Calligraphy
category: Basic
nodes:
  1:
    type: pen_input
  100:
    type: brush_settings
    inputs:
      spacing: 0.046481613
      stabilize: 0.6
      size: 0.05
  2:
    type: paint_color
  7:
    type: shape
    inputs:
      softness: 0.15
      # Plain disc (sine, amplitude 0 ⇒ r ≡ 1) squashed by `aspect` into the
      # elliptical broad-nib tip. `aspect` is area-preserving, so the nib is
      # ~6:1 here (1/0.4²). `rotation` is exposed to tilt the nib to taste
      # (e.g. the classic ~45° angle).
      aspect: 0.4
      rotation: 0.7853982
  8:
    type: stamp
  9:
    type: paint
connections:
- 1.position -> 9.position
- 2.color -> 8.color
- 7.mask -> 8.tip
- 8.dab -> 9.rgba
exposed_ports:
  100.stabilize: {}
  100.size: {}
  7.rotation: {}
  7.aspect: {}
  9.flow: {}
  9.opacity: {}
