name: Liquify
description: Pushes the pixels under the cursor along the stroke, warping the image without repainting it.
nodes:
  pen_input:
    type: pen_input
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 0.05
      spacing_min_px: 0.0
      size: 0.3
  liquify:
    type: liquify
connections:
- 'pen_input.distance -> liquify.distance'
- 'pen_input.motion -> liquify.motion'
- 'pen_input.position -> liquify.position'
exposed_ports:
  "brush_settings.stabilize": {}
  "brush_settings.size": {}
  "liquify.softness": {}
  "liquify.strength": {}
