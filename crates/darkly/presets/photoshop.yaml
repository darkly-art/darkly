# Photoshop overlay. Carries every binding where Photoshop's choice
# differs from at least one other reference editor, plus Darkly fallbacks
# for actions where Photoshop has no opinion but some other editor does.
# Unanimous bindings live in defaults.yaml; see the rule in defaults.yaml.
name: Photoshop
description: Adobe Photoshop-style keybindings

hotkeys:
  # placeSmartObject: intentionally unbound. Photoshop states no default for
  # placing an image as a non-destructive object, and inventing one would
  # set an expectation its users don't have — leave it to the menu and to
  # explicit user binding. GIMP does state one, so it binds this in
  # gimp.yaml.
  # Edit / clipboard (non-unanimous slice). PS matches Krita on these but
  # GIMP differs.
  redo: $mod+Shift+KeyZ
  pasteInPlace: $mod+Shift+KeyV
  # Photoshop binds Edit > Preferences to Ctrl+K (Cmd+K on macOS).
  openSettings: $mod+KeyK
  # mirrorViewH: intentionally unbound. Photoshop has no native mirror-
  # view action, and M is already taken by rectSelectTool here. Users
  # who want a mirror-view hotkey under the PS preset can set one via
  # the settings UI.
  # View framing. Photoshop binds View > "Fit on Screen" to Ctrl+0
  # (Cmd+0 on macOS). It has no separate "center in window" command —
  # centering is folded into the fit — so centerView is left unbound.
  fitToScreen: $mod+Digit0
  # Tools.
  brushTool: KeyB
  fillTool: KeyG
  gradientTool: Shift+KeyG
  colorPickerTool: KeyI
  rectSelectTool: KeyM
  ellipseSelectTool: Shift+KeyM
  magicWandTool: KeyW
  transformTool: $mod+KeyT
  toggleEraseMode: KeyE
  # Photoshop binds Lasso to L and Polygonal Lasso to Shift+L.
  lassoSelectTool: KeyL
  polygonSelectTool: Shift+KeyL
  # Layers.
  # Delete on the Layers panel deletes the active layer; the global Delete
  # binding (clearSelectionContents) coexists via the binding-site scope.
  deleteLayer: layerPanel:Delete
  duplicateLayer: $mod+KeyJ
  # Photoshop's "New Layer" is Ctrl+Shift+N.
  newLayer: $mod+Shift+KeyN
  # Photoshop binds Layer > Group Layers ("Quick Group") to Ctrl+G.
  newGroup: $mod+KeyG
  # Photoshop binds Layer > Merge Down to Ctrl+E.
  mergeDown: $mod+KeyE
  # Selection.
  clearSelection: $mod+KeyD
  invertSelection: $mod+Shift+KeyI
  # Photoshop binds Select > Modify > Feather to Shift+F6.
  featherSelection: Shift+F6
  # Colors. Photoshop binds Image > Adjustments > Invert to Ctrl+I (selection
  # invert is the Shift variant above). Krita agrees (Ctrl+I → Invert filter);
  # GIMP does NOT (its Ctrl+I is Invert Selection, Colors > Invert is unbound),
  # so this is per-overlay, not a default. The action id is `filterInvert` —
  # the dynamically-registered id for the `invert` filter (`filter` + type).
  filterInvert: $mod+KeyI
  # Photoshop binds Shift+Ctrl+U to Image > Adjustments > Desaturate (per
  # docs/photoshop-default-hotkeys.md, "Keys for the Image ▸ Adjustments
  # menu"). Krita agrees (Ctrl+Shift+U → `krita_filter_desaturate`); GIMP has
  # no default Desaturate shortcut, so this is per-overlay, not a default.
  # Our desaturate is the `black_and_white` filter.
  filterBlack_and_white: $mod+Shift+KeyU

mouse_clicks:
  # Photoshop's eyedropper modifier is Alt+drag (not Ctrl+drag).
  sampleColor: canvas@paint:alt+drag
  # Clone Stamp set-source — Photoshop's canonical Alt+click to set the
  # clone origin (same Alt modifier as the eyedropper). Brush-scoped so it
  # out-ranks `sampleColor` only while the Clone brush is active.
  setCloneSource: canvas@paint@clone:alt+drag
  # Photoshop uses Alt+click on a layer/mask thumbnail to isolate.
  isolateLayer:
    - layerThumb:alt+click
    - maskThumb:alt+click
  # Photoshop loads a mask as a selection with Ctrl/Cmd+click on the mask
  # thumbnail, and the layer's transparency with the same chord on the layer
  # thumbnail. $mod maps to Ctrl on Linux/Win, Cmd on macOS. alt+click is
  # taken by isolate above.
  maskToSelection: maskThumb:$mod+click
  alphaToSelection: layerThumb:$mod+click

settings:
  # Photoshop's eyedropper samples the current layer by default.
  tools.colorPickerSampleSource: currentLayer
