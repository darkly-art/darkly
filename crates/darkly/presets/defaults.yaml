# Editor-AGNOSTIC defaults. Bottom layer of the three-layer config resolution:
#
#   user override → overlay[active editor] → defaults  (this file)
#
# Hotkeys / mouse_clicks inclusion rule:
#
#   1. A binding lives here iff every reference editor (one per overlay in
#      this directory) agrees on its value. Verify against the actual editor
#      sources (krita/, gimp/) or the vendor's own documentation, not against
#      memory or web claims, before adding.
#
#   2. Darkly-original actions (no reference editor has any prior art) also
#      live here. Mark them explicitly so reviewers don't mistake them for #1.
#
#   3. Anything else must be split into each per-editor overlay. That covers
#      any binding where the editors disagree, where some editors have an
#      opinion and others don't, and any binding whose key some editor
#      spends on a different command or tool (even one Darkly lacks). The
#      `user → overlay → defaults` fallthrough makes silent inheritance the
#      default; this rule keeps the per-editor file authoritative for any
#      action that any editor would assign a key to, so an overlay can't
#      accidentally reuse the same key for a different action. An overlay
#      cannot drop a binding inherited from here (the config tests enforce
#      it), so a contested binding has to leave this file.
#
# Settings inclusion rule: Darkly-specific configuration (canvas size,
# animation rates, theme, …) that has no direct reference-editor analog
# lives here; settings the editors disagree on (e.g.
# tools.colorPickerSampleSource) are split into the per-editor overlays.

hotkeys:
  # Universal edit / clipboard / file bindings: every reference editor
  # agrees. (redo, pasteInPlace differ between editors and live per-overlay.)
  undo: $mod+KeyZ
  copy: $mod+KeyC
  cut: $mod+KeyX
  paste: $mod+KeyV
  saveDocument: $mod+KeyS
  saveDocumentAs: $mod+Shift+KeyS
  open: $mod+KeyO
  # File > New: Krita `file_new` (kritamenu.action), GIMP `image-new`
  # (image-actions.c), Photoshop and Clip Studio Paint all use $mod+N.
  newDocument: $mod+KeyN
  # Darkly-original: no reference editor has a paste-as-smart-object
  # analogue, so there is no convention to inherit and this lives in
  # defaults rather than per-overlay. Verified free of collisions in
  # defaults and every overlay (the only other KeyV bindings are
  # `paste` here and `pasteInPlace` per-overlay).
  pasteAsSmartObject: $mod+Alt+Shift+KeyV
  selectAll: $mod+KeyA
  clearSelectionContents: Delete
  # Apply / discard the open edit session (a transform, pasted content,
  # stroke edit). Enter / Escape are the universal commit/cancel keys:
  # Krita's tool-invocation Confirm / Cancel, GIMP's tool-widget CONFIRM /
  # CANCEL, PS's floating-selection handlers, and Clip Studio Paint's
  # transform confirm / cancel.
  applyEditSession: Enter
  discardEditSession: Escape
  # Colors: every reference editor uses X to swap. (Reset is per-overlay:
  # Clip Studio Paint has no reset and spends D on a tool.)
  swapColors: KeyX
  # Brush parameter hotkeys: `[` / `]` is the universal sizing convention.
  brushSizeUp: BracketRight
  brushSizeDown: BracketLeft
  # Darkly-original (rule #2): cycling by recency has no reference-editor
  # analog. Krita's `/` is "Switch to Previous Preset" (krita/krita/krita.action
  # previous_preset), a single slot with no chain; Photoshop's `,` / `.` and
  # GIMP's unbound context-brush-select-previous/next walk list order. The key
  # follows Krita, the one editor with a brush-recall key. Verified free in
  # defaults and all four overlays (Photoshop's `/` is transparency lock, GIMP's
  # is action search, Clip Studio Paint's is the Zoom tool; none of those
  # actions exist in Darkly).
  cycleRecentBrush: Slash
  # Photoshop binds Edit > Preferences to $mod+K; Krita/GIMP have no
  # default. Darkly picks the macOS preferences convention.
  openSettings: $mod+Comma
  # Image export is folded into Save As (the save picker's type dropdown
  # offers PNG/JPEG/WebP alongside `.darkly`), so there's no separate
  # export-image hotkey; Save As ($mod+Shift+KeyS) covers it.
  # Canvas resize. Photoshop binds Image Size to $mod+Alt+I and Canvas Size
  # to $mod+Alt+C; GIMP/Krita have no default for canvas size. Darkly takes
  # Photoshop's Canvas Size binding. `cropToSelection` stays menu-only (no
  # reference editor binds it).
  resizeCanvas: $mod+Alt+KeyC
  # Darkly-original (brush builder): no reference-editor prior art.
  addBrushNode: Shift+KeyA
  # Darkly-original (stroke edit): no reference editor redraws a finished
  # raster stroke with new brush settings. Plain Y follows the nearest
  # analog, Clip Studio Paint's Correct Line tools (Redraw vector line) on
  # Y. GIMP (MyPaint Brush) and Photoshop (History Brush) spend Y on tools
  # Darkly lacks, and no overlay binds plain Y.
  toggleStrokeEdit: KeyY
  # Darkly-original (command palette). No Krita/PS/GIMP prior art, so it
  # belongs here rather than a per-editor overlay. Follows the VS Code
  # convention for a command palette ($mod+Shift+P), plus $mod+F as a
  # find-style alias for reaching any action by name.
  commandPalette:
    - $mod+Shift+KeyP
    - $mod+KeyF
  # PS + Krita both bind Quick Group to Ctrl+G. GIMP has no default
  # (the Layer menu's group commands aren't bound). With layers
  # selected, the action handler wraps them in the new group; with
  # nothing selected, creates an empty group.
  newGroup: $mod+KeyG
  # PS + Krita both bind Merge Down to Ctrl+E. GIMP's only layer-merge
  # default is Ctrl+M for "Merge Visible Layers", a semantically
  # different action. The `mergeDown` action handler is selection-aware:
  # with ≥2 selected it bakes the selection via merge_layers, with 1
  # it does the classic single-layer merge-down. One hotkey, two ops.
  mergeDown: $mod+KeyE
  # `flatten` and `addMask` are intentionally left unbound here:
  #   - addMask: no reference editor has a default key (PS, Krita,
  #     and GIMP all expose mask creation through a button click).
  #   - flatten: Krita binds Ctrl+Shift+E to "Flatten image" (the
  #     whole-canvas composite, which is Darkly's `flatten_image`
  #     engine op, not yet a registered action). Borrowing that key
  #     for Darkly's single-layer flatten (apply-mask / flatten-group)
  #     would mislead Krita artists. If someone registers `flattenImage`
  #     as an action, that's where Ctrl+Shift+E belongs.
  #   - maskToSelection: no editor ships a keyboard key (Krita/GIMP both
  #     use empty/NULL accelerators); the canonical gesture is Ctrl/Cmd+
  #     click on the mask thumbnail, bound as `maskThumb:$mod+click` in the
  #     krita/photoshop overlays (the editors disagree on the chord, so it
  #     can't live here per rule #3). Also reachable via the mask context
  #     menu and the command palette.

mouse_clicks:
  # Darkly-original (rule #2). Krita's popup palette is also on right-click.
  palettePopup: canvas:rightDrag

settings:
  # Canvas defaults.
  canvas.width: 1920
  canvas.height: 1080
  # Prefill for the manual DPI field in New Document, nothing more: an auto
  # document derives its DPI from its pixel size.
  canvas.dpi: 300.0
  canvas.backgroundColor: "#000000"
  # Autosave / crash recovery. Darkly-original (no reference-editor analog).
  autosave.enabled: true
  autosave.intervalSeconds: 120
  # Process recording (timelapse). Passive capture, embedded in the .darkly file.
  recording.enabled: true
  recording.minIntervalSeconds: 1.5
  recording.maxLongEdge: "1920"
  # Animation tick divisors.
  animation.screen_divisor: 2
  animation.overlay_divisor: 4
  animation.canvas_divisor: 2
  # Rendering - one effect scale for both spaces. Default = sqrt(.5) = 0.7071 =
  # half the texels, so roughly half the processing power compared to 1.0.
  rendering.effect_scale: 0.7071
  # Display.
  display.pixelFilter: auto
  # Navigation.
  nav.panSensitivity: 0.5
  hotkeys.nav.trigger: Space
  hotkeys.nav.rotate: Shift
  hotkeys.nav.zoom: Ctrl
  # Krita: Discrete Rotate = Alt (DISCRETE_ANGLE_STEP 15°); cardinal detent
  # (45° within ±2°) is Krita's hardwired free-rotation snap, toggleable here.
  hotkeys.nav.rotateSnap: Alt
  nav.rotateDetent: true
  # UI.
  ui.theme: dark
  ui.brushBuilder.previewVisible: true
  ui.brushBuilder.previewWidth: 320
  ui.brushBuilder.previewHeight: 120
  ui.toolStrip.edge: left
  ui.toolStrip.offset: 0.5
  ui.toolStrip.autoHide: false
  ui.palettePopup.recentColors: 5
  # Input.
  input.fingerPainting: true
  # Stroke prediction look-ahead in ms (0 = off). See config/sections/input.rs.
  input.predictionHorizon: 10.0
  # Editing.
  edit.activateTransformAfterPaste: true
  # Colors.
  colors.defaultForeground: "#ffffff"
  colors.defaultBackground: "#000000"
  colors.lockToBrush: false
  colors.jitterHue: 0.0
  colors.jitterSaturation: 0.0
  colors.jitterValue: 0.0
