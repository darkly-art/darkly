# Krita overlay. Carries every binding where Krita's choice differs from
# at least one other reference editor, plus Darkly fallbacks for actions
# where Krita has no opinion but some other editor does. Unanimous
# bindings (those all three reference editors agree on) live in
# defaults.yaml; see the rule in defaults.yaml's header.
name: Krita
description: Krita-style keybindings

hotkeys:
  # placeSmartObject: intentionally unbound. Krita states no default for
  # placing an image as a non-destructive object, and inventing one would
  # set an expectation its users don't have — leave it to the menu and to
  # explicit user binding. GIMP does state one, so it binds this in
  # gimp.yaml.
  # Edit / clipboard (non-unanimous slice). Krita matches PS on these but
  # GIMP differs (Redo: <primary>Y, Paste-In-Place: <primary><alt>V — see
  # gimp/app/actions/edit-actions.c), so each value is pinned per-overlay.
  redo: $mod+Shift+KeyZ
  pasteInPlace: $mod+Shift+KeyV
  # Krita has no native Preferences hotkey. Fall through to Darkly's
  # macOS-convention pick; users can rebind via the settings UI.
  openSettings: $mod+Comma
  # View > Mirror View. Krita binds M (kritamenu.action `mirror_canvas`,
  # <shortcut>M</shortcut>). Photoshop and GIMP have no opinion; their
  # overlays leave mirrorViewH unbound rather than reuse M (Photoshop's
  # M is rectSelectTool).
  mirrorViewH: KeyM
  # View framing. Krita's `zoom_to_fit` ("Fit to View") ships an empty
  # <shortcut> in kritamenu.action — no default key — and Krita has no
  # center-in-window action at all. Both fitToScreen and centerView are
  # therefore left unbound under the Krita preset (neither lives in
  # defaults.yaml, so omission here means no key). Users can bind them
  # via the settings UI; GIMP/Photoshop carry their own defaults.
  # Tools.
  brushTool: KeyB
  fillTool: KeyF
  gradientTool: KeyG
  colorPickerTool: KeyP
  rectSelectTool: KeyR
  ellipseSelectTool: Shift+KeyR
  magicWandTool: KeyW
  transformTool: KeyT
  toggleEraseMode: KeyE
  # Krita's selection-tool .action files have empty <shortcut>. Fall
  # through to Photoshop's L / Shift+L convention.
  lassoSelectTool: KeyL
  polygonSelectTool: Shift+KeyL
  # Layers.
  isolateLayer: KeyI
  deleteLayer: Shift+Delete
  duplicateLayer: $mod+KeyJ
  # Krita's "Add Paint Layer" is bound to Insert (kritamenu.action).
  newLayer: Insert
  # Krita binds "Quick Group" to Ctrl+G (krita.action).
  newGroup: $mod+KeyG
  # Krita binds "Merge with Layer Below" to Ctrl+E (krita.action
  # `merge_layer`, <shortcut>Ctrl+E</shortcut>). The action handler is
  # selection-aware: with ≥2 selected it bakes the selection via
  # merge_layers, with 1 it does the classic single-layer merge-down.
  mergeDown: $mod+KeyE
  # Selection.
  clearSelection: $mod+Shift+KeyA
  invertSelection: $mod+Shift+KeyI
  # Colors. Krita binds Ctrl+I to Invert (`krita_filter_invert`); Invert
  # Selection is the Shift variant above. Photoshop agrees (Ctrl+I → Image >
  # Adjustments > Invert); GIMP does NOT (Ctrl+I is its Invert Selection), so
  # this is per-overlay, not a default. The action id is `filterInvert` —
  # the dynamically-registered id for the `invert` filter (`filter` + type).
  filterInvert: $mod+KeyI
  # Krita binds Ctrl+Shift+U to Desaturate (`krita_filter_desaturate`, per
  # docs/krita-default-hotkeys.md). Photoshop agrees (Shift+Ctrl+U → Image >
  # Adjustments > Desaturate); GIMP has no default Desaturate shortcut, so
  # this is per-overlay, not a default.
  # Our desaturate is the `black_and_white` filter.
  filterBlack_and_white: $mod+Shift+KeyU

mouse_clicks:
  # Krita's default "Sample FG color from merged image" — Ctrl+drag on
  # Linux/Win, Cmd+drag on macOS (Qt::CTRL auto-maps to Command).
  sampleColor: canvas@paint:$mod+drag
  # Clone brush set-source — Krita sets the clone origin with Ctrl+click,
  # the same modifier as its colour sampler. Brush-scoped so it out-ranks
  # `sampleColor` only while the Clone brush is active (see
  # `hotkey_resolve.ts` specificity); with any other brush the same
  # $mod+drag still samples colour.
  setCloneSource: canvas@paint@clone:$mod+drag
  # Krita's "Change Primary Setting" — shift+drag scrubs brush size.
  brushSizeAdjust: canvas@paint:shift+drag
  # Krita uses Alt+click on a layer/mask thumbnail to isolate the node.
  isolateLayer:
    - layerThumb:alt+click
    - maskThumb:alt+click
  # Krita loads a mask/alpha as a selection with Ctrl+click on the thumbnail
  # (NodeDelegate.cpp → SelectOpaqueRole). $mod maps to Ctrl on Linux/Win,
  # Cmd on macOS. alt+click is taken by isolate above.
  #
  # Krita routes both thumbnails through the one Select Opaque path
  # (kis_selection_manager.cc → selectOpaqueOnNode reads the node's
  # projection opacity). Darkly splits them by which op is cheaper: a mask
  # is an R8 clone, a layer needs its alpha read back.
  maskToSelection: maskThumb:$mod+click
  alphaToSelection: layerThumb:$mod+click

settings:
  tools.colorPickerSampleSource: merged
