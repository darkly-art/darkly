[package]
name = "darkly"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
profile = []
# Enables blocking GPU readbacks, `gpu::test_utils`, and `*::test_readback_*`
# accessors. WebGPU/WASM deadlocks on these (see CLAUDE.md "No Blocking GPU
# Readbacks"); the feature exists so `cargo test` and the bench bins can opt
# in while production / WASM builds cannot reach the API at all.
#
# Implies `ts-export` so the protocol generator test (which emits the typed TS
# client) and clippy both see the `#[derive(TS)]` impls under the standard
# `--features darkly/testing` invocation, while release / WASM builds — which
# never enable `testing` — carry zero ts-rs code.
testing = ["ts-export"]
# Compiles the `#[derive(ts_rs::TS)]` impls on the protocol request/response
# types plus the registration type-identity metadata that drives codegen.
# Test/codegen-only: gated exactly like `testing` so ts-rs is never linked into
# the shipping wasm/native binary.
ts-export = ["dep:ts-rs"]

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
serde_yaml_ng = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
zip = { workspace = true }
image = { workspace = true }
png = { workspace = true }
quick-xml = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
slotmap = { workspace = true }
smallvec = { workspace = true }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
pollster = "0.4"
naga = { version = "29.0", features = ["wgsl-in"] }
syn = { version = "2", features = ["visit", "full"] }

[[bin]]
name = "stroke_replay_bench"
required-features = ["testing"]

[[bin]]
name = "stroke_replay_matrix"
required-features = ["testing"]

[lints]
workspace = true
