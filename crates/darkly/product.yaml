# What Darkly says it is, in one place.
#
# The store listing, the desktop entry, the installer metadata and the README
# all need the same summary, description and categories in four different
# syntaxes. Before this file they were four hand-written copies, and they
# disagreed: the AppImage maker advertised `Graphics;2DGraphics`, the deb maker
# `Graphics`, and the desktop entry a third list again, so the app landed in a
# different menu section depending on how it was installed.
#
# This file is the authority. Edit it here, then run `cargo sync-docs` to push
# it into packaging/art.darkly.Darkly.desktop,
# packaging/art.darkly.Darkly.metainfo.xml and packaging/app.json. Never edit
# those: they are generated, and the test suite fails on a stale one.

# The one-line pitch. AppStream lints above 35 characters, and a desktop entry's
# `Comment` is truncated by most shells well before that, so keep it short and
# give it no trailing period.
summary: "Forbidden Editor for Artists"

# Freedesktop menu categories. One list, so every channel files the app in the
# same place. Values come from the freedesktop menu spec, not from invention.
categories: ["Graphics", "2DGraphics", "RasterGraphics"]

# Desktop-entry search keywords: what someone types into a launcher when they
# want this and do not know its name.
keywords: ["art", "draw", "paint", "image", "photo", "picture", "editor"]

# The short description: a paragraph for places with room for more than the
# summary but not a store listing.
description: "Darkly is a GPU-native paint program built for artists. It has a powerful brush engine and dark arts to help you commune with your imagination."

# The long description, taken from the README: its intro, pledges, and the
# Veils and Voids sections, word for word minus the links and Markdown
# emphasis (AppStream allows neither links nor bold here). Each entry is a
# paragraph, a list of strings for a bulleted list, or `heading:` for a
# section title. Keep it in step with the README by hand.
long_description:
  - "Do you suffer from the oppressive sanity of rulers, guides, and nondestructive workflows? Break free with Darkly, home of happy accidents and beautiful catastrophes. Release your creativity from the bonds of logic. Madness isn't a bug, it's a feature."
  - "Darkly is a Photoshop alternative where painters are first-class citizens. It has a powerful brush engine, and dark arts to help you commune with your imagination."
  - "Darkly pledges to:"
  - - "🛐 Honor human imagination"
    - "⚛️ Run offline and without a login"
    - "☯️ Never steal or license your art"
    - "☮️ Stay free and open source forever"
  - heading: "Dark Arts"
  - "Veils are where Darkly gets its name; \"For now we see through a glass, darkly\". They're a special layer that shrouds your canvas in a mysterious way, inviting you to see something that maybe wasn't there before."
  - "Veils are nondestructive. You can paint as usual, behind the veil, and when you disable it, you'll see the full-res result."
  - "Veils are essentially fancy shaders, and they are fun toys. But they have practical uses too:"
  - - "By hiding fine details, they can prevent premature fixation on detail, freeing you to focus on composition."
    - "During the sketching / ideation phase, they can help with blank page syndrome and destructive self-criticism by giving you permission to be messy, and explore freely."
    - "They can also help remedy art fatigue (losing eyes for a piece by staring at it for too long) by helping you see it through a fresh lens."
  - "Voids are a type of layer that specializes in pulling inspiration from outside sources."
  - "You can use the Noise void to generate entropy, or Screenshare to stream another app (3D software, movie, or video game) directly into a layer. This is great for hybrid workflows, and situations where you need a quick reference, or want to try out different lighting or camera angles, without having to pose, render and paste over and over."
  - "Voids support masks and blend modes. They are the natural complement to veils, and a natural integration point for other art programs like Blender, which has its own dedicated void 🧡"
