version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    # TypeScript moves by hand. svelte-check's peer range accepts 5 and 6
    # only, so a major bump fails `npm ci` before anything compiles. The
    # ceiling lives in frontend/package.json.
    ignore:
      - dependency-name: "typescript"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /desktop
    target-branch: dev
    schedule:
      interval: weekly
    # TypeScript moves by hand, kept in step with the frontend, where
    # svelte-check's peer range caps it at 6. The ceiling lives in
    # desktop/package.json.
    ignore:
      - dependency-name: "typescript"
    groups:
      # Electron carries Chromium, which is Darkly's renderer: a major bump
      # swaps out the WebGPU implementation the whole editor draws through.
      # It gets its own PR so a WebGPU regression has exactly one suspect.
      electron:
        patterns:
          - "electron"
      desktop:
        patterns:
          - "*"
        exclude-patterns:
          - "electron"

  - package-ecosystem: npm
    directory: /docs-site
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Kept in step with the frontend, where svelte-check's peer range caps
      # it; @astrojs/check and svelte-check constrain it here too.
      - dependency-name: "typescript"
      # src/shared/ is written against these frameworks, and other sites
      # compile it with their own copies, so a major moves by hand, with a
      # release note that importers of shared/ must upgrade too. The
      # @astrojs/* integrations and svelte-check track the Astro and Svelte
      # majors, so they are held back with them.
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte-check"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pagefind"
        update-types: ["version-update:semver-major"]
    groups:
      docs-site:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
