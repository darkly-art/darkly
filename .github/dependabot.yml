version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /desktop
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # Electron carries Chromium, which is Darkly's renderer: a major bump
      # swaps out the WebGPU implementation the whole editor draws through.
      # It gets its own PR so a WebGPU regression has exactly one suspect.
      electron:
        patterns:
          - "electron"
      desktop:
        patterns:
          - "*"
        exclude-patterns:
          - "electron"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
