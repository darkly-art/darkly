name: Docs artifact

# Publishes the documentation site for a release: `make docs` builds it from
# this checkout (the manual under `docs/manual/`, every registry's metadata,
# and a rendered preview for every entry that declares one), and the asset
# carries two trees from that one run:
#
#   site/    the built docs, rooted at the site root and built for /docs/
#   shared/  docs-site/src/shared/ as source
#
# The consumer is pull-based and is not named here on purpose: this repo is
# public and knows nothing about who reads the asset. Whoever wants it
# resolves it off the release and unpacks it.
#
# `shared/` is source other sites import by path and compile with their own
# toolchain. Renaming or removing a file there, or changing BaseLayout's
# props, breaks their next build; scripts/check-shared.mjs holds the tree to
# importing nothing outside itself.
#
# Previews need a device and the `testing` feature, so `render-docs` runs here
# on the same Mesa software rasterizer `ci.yml` already tests against. Frames
# never leave this job: 1 599 PNGs and 75 MB, which ffmpeg turns into a poster
# and a looping H.264 per entry (under 2 MB) before anything is packed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to attach the artifact to. Leave blank to build
          and upload for inspection without touching any release.
        required: false

jobs:
  docs-artifact:
    name: make docs -> release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full checkout (with .git) so build.rs's `git describe --tags` resolves:
      # that string is the version every page carries, and a shallow checkout
      # breaks it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # fontconfig for native font enumeration via fontique; lavapipe because
      # `render-docs` wants a Vulkan device and a runner has no GPU (the same
      # software rasterizer the test suite runs on); ffmpeg to encode.
      - name: Install fontconfig, Mesa lavapipe and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev mesa-vulkan-drivers vulkan-tools libvulkan1 ffmpeg
          vulkaninfo --summary || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The frontend's deps for the icon resolver (@iconify), the docs site's
      # for the site itself.
      - name: npm ci (frontend)
        working-directory: frontend
        run: npm ci
      - name: npm ci (docs-site)
        working-directory: docs-site
        run: npm ci

      - name: Build the docs site
        env:
          WGPU_BACKEND: vulkan
        run: make docs
      - name: Links, search index, shared contract
        working-directory: docs-site
        run: npm test

      # Which release this ends up on: the pushed tag, or the one a manual run
      # names. A dispatch with no tag names nothing and stops after the upload
      # below: a real dry run of the export that touches no release.
      - name: Resolve target release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "TARGET=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TARGET=$INPUT_TAG" >> "$GITHUB_ENV"
          fi

      - name: Pack
        run: |
          # Named like every other release artifact, Darkly-<version>-<what>;
          # a run off a branch carries the branch name as its version.
          VERSION="${TARGET:-${GITHUB_REF_NAME//\//-}}"
          NAME="Darkly-${VERSION#v}-docs-site.tar.gz"
          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"
          mkdir stage
          cp -r docs-site/dist stage/site
          cp -r docs-site/src/shared stage/shared
          tar czf "$NAME" -C stage site shared
          # Exactly two top-level trees.
          tar tzf "$NAME" | cut -d/ -f1 | sort -u

      - name: Upload for inspection
        uses: actions/upload-artifact@v7
        with:
          name: docs-artifact
          path: ${{ env.ARTIFACT }}

      # The release object for a tag is produced outside this repo, so this job
      # may run before or after it exists; create-if-missing plus --clobber
      # makes either order work, and makes a re-run idempotent.
      #
      # Draft, when this job is the one that creates it. A v* tag is not a
      # finished release: the desktop bundles are built elsewhere and land on
      # this same release afterwards, and a release goes public only when a
      # human publishes it with everything attached. Creating a published
      # release here would put a bundle-less release in front of users.
      - name: Attach to the release
        if: env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #
        # The notes are GitHub's generated list, shaped by .github/release.yml.
        # Written only when this job creates the release: a re-run against an
        # existing one re-attaches the asset and leaves its body alone.
        run: |
          if ! gh release view "$TARGET" >/dev/null 2>&1; then
            gh release create "$TARGET" --draft --prerelease --generate-notes --title "$TARGET"
          fi
          gh release upload "$TARGET" "$ARTIFACT" --clobber
