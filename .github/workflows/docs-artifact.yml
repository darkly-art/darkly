name: Docs artifact

# Publishes the documentation artifact for a release: the hand-written manual
# under `docs/manual/`, `metadata.json` (the projection of every registry
# Darkly has), and a rendered preview for every entry that declares one. They
# go in one tarball under one `version`, so a consumer can never pair prose
# from one build with metadata, or a preview, from another.
#
# The consumer is pull-based and is not named here on purpose: this repo is
# public and knows nothing about who reads the artifact. Whoever wants it
# resolves this asset off the release and unpacks it.
#
# `docs/manual/` is **pure markdown**. It must not reference components from any
# consumer, or the public repo acquires an invisible dependency on private code.
# Anything needing a component is a generated page on the consumer side.
#
# Two exports, not one. `export-docs` is GPU-free by construction (it builds
# from `&'static` registration data alone) while `render-docs` needs a device
# and the `testing` feature, and runs here on the same Mesa software rasterizer
# `ci.yml` already tests against. They travel in one tarball under one
# `version` for the same reason the prose does: an entry's row and its preview
# must come from the same build.
#
# Frames never leave this job. `render-docs` writes 1 599 PNGs and 75 MB, which
# ffmpeg turns into a poster and a looping H.264 per entry (under 2 MB) before
# anything is packed. That is the same shape as the icon step: resolve it here
# so no consumer needs the toolchain.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to attach the artifact to. Leave blank to build
          and upload for inspection without touching any release.
        required: false

jobs:
  docs-artifact:
    name: export-docs + manual → release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full checkout (with .git) so build.rs's `git describe --tags` resolves:
      # that string is what stamps `version`, and a shallow checkout breaks it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # fontconfig for native font enumeration via fontique; lavapipe because
      # `render-docs` below wants a Vulkan device and a runner has no GPU (the
      # same software rasterizer the test suite runs on); ffmpeg to encode.
      - name: Install fontconfig, Mesa lavapipe and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev mesa-vulkan-drivers vulkan-tools libvulkan1 ffmpeg
          vulkaninfo --summary || true
      - uses: dtolnay/rust-toolchain@stable

      - name: Export registry metadata
        run: cargo run -p darkly --bin export-docs -- --out out/metadata.json

      # Release, not debug: this renders 1 599 frames through the software
      # rasterizer, and the compile is bought back many times over.
      - name: Render previews
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --release -p darkly --features testing --bin render_docs -- --out frames

      # An icon name is not self-describing, so the artifact carries resolved SVG
      # rather than asking a consumer to own an icon toolchain. Needs the
      # frontend's @iconify deps; the encoder below needs nothing but ffmpeg.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Resolve icons
        run: node frontend/scripts/export-doc-icons.mjs --metadata out/metadata.json --out out/icons.json

      - name: Encode previews
        run: node scripts/encode-doc-previews.mjs --frames frames --out out

      - name: Stage the manual
        run: cp -r docs/manual out/manual

      # Which release this ends up on: the pushed tag, or the one a manual run
      # names. A dispatch with no tag names nothing and stops after the upload
      # below: a real dry run of the export that touches no release.
      - name: Resolve target release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "TARGET=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TARGET=$INPUT_TAG" >> "$GITHUB_ENV"
          fi

      - name: Pack
        run: |
          NAME="darkly-docs-${TARGET:-${GITHUB_REF_NAME//\//-}}.tar.gz"
          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"
          tar czf "$NAME" -C out .
          tar tzf "$NAME"

      - name: Upload for inspection
        uses: actions/upload-artifact@v7
        with:
          name: docs-artifact
          path: ${{ env.ARTIFACT }}

      # The release object for a tag is produced outside this repo, so this job
      # may run before or after it exists; create-if-missing plus --clobber
      # makes either order work, and makes a re-run idempotent.
      - name: Attach to the release
        if: env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TARGET" >/dev/null 2>&1 \
            || gh release create "$TARGET" --generate-notes
          gh release upload "$TARGET" "$ARTIFACT" --clobber
