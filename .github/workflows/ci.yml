name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel an in-progress run when a newer commit is pushed to the same ref
# (PR or branch), so we don't burn CI minutes on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Disable HTTP/2 multiplexing for crates.io downloads. curl's HTTP/2
  # against the GitHub-hosted runner network intermittently fails with
  # "[16] Error in the HTTP2 framing layer", aborting dependency fetches
  # (e.g. moxcms via image). Forcing HTTP/1.1 makes registry fetches
  # reliable at a negligible throughput cost.
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  dashes:
    name: no en/em dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-dashes.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  package:
    name: cargo package (crates.io manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Catches manifest defects that only surface at release time, when a `v*`
      # tag runs .github/workflows/publish.yml: a dependency published without
      # a version requirement, a missing readme, an unpackageable path. Manifest
      # checks only, so --no-verify skips the compile the real publish does.
      - run: cargo package -p darkly-macros -p darkly --no-verify

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fontconfig (native font enumeration via fontique)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --exclude darkly-wasm --features darkly/testing -- -D warnings

  clippy-wasm:
    name: clippy (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy -p darkly-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

  test:
    name: cargo test + coverage
    runs-on: ubuntu-latest
    steps:
      # Full history so build.rs's `git describe --tags` resolves and the
      # version tests compare against a real tag instead of the fallback
      # (docs/versioning.md: any CI job that builds needs fetch-depth 0).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Mesa Vulkan software renderer (lavapipe) + fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1 libfontconfig1-dev
          vulkaninfo --summary || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov
        env:
          WGPU_BACKEND: vulkan
        run: cargo llvm-cov --workspace --exclude darkly-wasm --features darkly/testing --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage upload is best-effort: tests are the gate, and we
          # don't want a Codecov-side outage to redden a PR whose tests
          # pass. The GPG signature check on Codecov's CLI binary stays
          # ON: when their keyserver fails to serve the public key the
          # upload step aborts before running the unverified binary
          # (which has access to CODECOV_TOKEN and the repo), and CI
          # surfaces it as a job-level warning instead of a failure.
          fail_ci_if_error: false
          flags: rust

  protocol-ts:
    name: generated TS client in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mesa Vulkan software renderer (lavapipe) + fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1 libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      # `frontend/src/engine/protocol_gen.ts` is generated from the request
      # registry, and the test that asserts it matches what is checked in is
      # behind `ts-export` (ts-rs is off the production and wasm path, so no
      # other job enables it). Without this job that assertion never runs
      # anywhere, and a handler can drift from the frontend's typed client
      # unnoticed. The feature flags match the regeneration command the test
      # prints on failure, so a red X here is directly actionable.
      - name: cargo test --test protocol (ts-export)
        env:
          WGPU_BACKEND: vulkan
        run: cargo test -p darkly --test protocol --features testing,ts-export -- --test-threads=1

  wasm-build:
    name: wasm-pack build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: wasm-pack build (release)
        working-directory: frontend/wasm
        run: wasm-pack build --release --target web --out-dir pkg

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: wasm:build
        working-directory: frontend
        # Run before vitest so test files that transitively import the
        # config store (which loads `wasm/pkg/darkly_wasm`) can resolve.
        # `npm run build` would also rebuild the pkg, but doing it once
        # explicitly here keeps the test step independent.
        run: npm run wasm:build
      - name: vitest
        working-directory: frontend
        run: npm test
      - name: vite build (includes svelte-check via tsc)
        working-directory: frontend
        run: npm run build

  desktop:
    name: desktop host typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: tsc
        working-directory: desktop
        run: npx tsc --noEmit

      - name: vitest
        working-directory: desktop
        run: npm test

  packaging:
    name: desktop integration metadata
    runs-on: ubuntu-latest
    steps:
      # The release gate below needs the tags; only a PR into master pays for
      # the full clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.base_ref == 'master' && 0 || 1 }}

      # Release-prep gate. A PR into master ships a release, and the tag that
      # follows the merge is the irreversible step (publish.yml fires on it),
      # so the snapshot must already carry an entry newer than the last tag
      # this PR descends from. This is the shell twin of
      # `releases.rs::previous_tag` (same rule, no shared runtime), the same
      # documented exception docs/versioning.md makes for build.rs and
      # vite.config.ts; change one, change the other.
      - name: Release snapshot is ahead of the last tag
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: |
          last=$(git tag --merged HEAD --list 'v*' --sort=-v:refname \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          newest=$(jq -r '.[0].version // empty' crates/darkly/releases.json)
          if [ -z "$last" ] || [ -z "$newest" ]; then
            echo "::error::no v*.*.* tag reachable from HEAD ($last) or no snapshot entry ($newest); is the checkout full?"
            exit 1
          fi
          if ! printf '%s\n%s\n' "${last#v}" "$newest" | sort -V -C -u; then
            echo "::error::releases.json newest entry $newest is not newer than $last; run cargo releases --fetch X.Y.Z"
            exit 1
          fi

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packaging/art.darkly.Darkly.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packaging/art.darkly.Darkly.desktop
