name: Publish to crates.io

# Releases the `darkly` core crate and its `darkly-macros` proc-macro dependency
# when a `v*` tag is pushed. The tag is the version source of truth (the same
# tags build.rs bakes into DARKLY_VERSION); the versions in the crates' Cargo.toml
# are vestigial and overwritten here. Both crates are published at the same
# version — `darkly` pins `darkly-macros` from its path dependency, so they move
# in lockstep and `darkly-macros` must go up first.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: cargo publish darkly + darkly-macros
    runs-on: ubuntu-latest
    steps:
      # Full checkout (with .git) so build.rs's `git describe --tags` resolves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install fontconfig (native font enumeration via fontique)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable

      - name: Derive crate version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set crate versions
        run: |
          cargo install cargo-edit --locked
          cargo set-version -p darkly-macros "$VERSION"
          cargo set-version -p darkly "$VERSION"

      # --allow-dirty: the version lines above are rewritten but not committed.
      # cargo publish compiles each crate as its verification step (no GPU
      # needed), and refuses to overwrite an already-published version.
      # darkly-macros first: `darkly`'s path dependency pins it to this exact
      # version, so it must exist on the index before `darkly` is published.
      # cargo publish blocks until the crate lands in the index before returning.
      - name: Publish darkly-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p darkly-macros --allow-dirty

      - name: Publish darkly
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p darkly --allow-dirty
