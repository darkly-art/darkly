name: Publish to crates.io

# Releases the `darkly` core crate when a `v*` tag is pushed. The tag is the
# version source of truth (the same tags build.rs bakes into DARKLY_VERSION);
# the version in crates/darkly/Cargo.toml is vestigial and overwritten here.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: cargo publish darkly
    runs-on: ubuntu-latest
    steps:
      # Full checkout (with .git) so build.rs's `git describe --tags` resolves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install fontconfig (native font enumeration via fontique)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable

      - name: Derive crate version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set crate version
        run: |
          cargo install cargo-edit --locked
          cargo set-version -p darkly "$VERSION"

      # --allow-dirty: the version line above is rewritten but not committed.
      # cargo publish compiles the crate as its verification step (no GPU
      # needed), and refuses to overwrite an already-published version.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p darkly --allow-dirty
